version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:20.19.5
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify image compiler toolchain
          command: |
            node --version
            npm --version
            python3 --version
            make --version
            g++ --version
      - run:
          name: Deterministic Node.js dependencies (no Electron postinstall)
          command: npm ci --ignore-scripts --no-audit --no-fund
      - run:
          name: Build SQLite native dependency for Node.js
          command: npm rebuild better-sqlite3 --build-from-source
      - run:
          name: Check code and assembled UI
          command: |
            mkdir -p /tmp/complaints-ci
            set -o pipefail
            npm run check 2>&1 | tee /tmp/complaints-ci/check.log
      - run:
          name: Test server, security, state and UI
          command: |
            mkdir -p /tmp/complaints-ci
            set -o pipefail
            npm test 2>&1 | tee /tmp/complaints-ci/test.log
      - store_artifacts:
          path: /tmp/complaints-ci
          destination: diagnostic-logs

workflows:
  build-and-test:
    jobs:
      - test
