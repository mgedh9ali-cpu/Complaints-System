name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Verify installed dependency tree
      run: npm ls --all

    - name: Build SQLite native module for Node.js
      run: npm rebuild better-sqlite3 --build-from-source

    - name: Run Tests
      run: npm test

    - name: Syntax and assembled UI checks
      run: npm run check

    - name: Audit every dependency finding
      run: npm audit --audit-level=low
