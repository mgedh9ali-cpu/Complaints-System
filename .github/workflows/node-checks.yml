name: Node checks
on:
  push:
    branches: [main, local-sqlite-foundation, 'chore/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
concurrency:
  group: node-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Install dependencies without Electron ABI rebuild
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed dependency tree
        run: npm ls --all

      - name: Build SQLite module for Node.js
        run: npm rebuild better-sqlite3 --build-from-source
      - run: npm run check
      - run: npm test
      - name: Audit every dependency finding
        run: npm audit --audit-level=low
