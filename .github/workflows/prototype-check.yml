name: Prototype checks

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify required prototype files
        run: test -s index.html && test -s styles.css && test -s app.js
      - name: Verify modal focus trap and CSV formula mitigation
        run: grep -Fq 'const items=$(' app.js && grep -Fq 'function csvSafe(value)' app.js && grep -Fq 'aria-describedby="modalDescription"' app.js
      - name: Run prototype safety regression tests
        run: node --test tests/*.test.cjs
