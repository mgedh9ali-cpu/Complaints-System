name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify installed dependency tree
        run: npm ls --all

      - name: Verify SQLite native runtime for Node.js tests
        run: npm run check:sqlite

      - name: Syntax checks
        run: npm run check

      - name: Run tests
        timeout-minutes: 5
        run: npm test -- --test-timeout=120000

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Rebuild native SQLite for Electron
        run: npx electron-builder install-app-deps

      - name: Build installer and portable EXE
        # Confirm startup against this exact build, including reused package versions.
        env:
          COMPLAINTS_BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          node -e "require('fs').writeFileSync('desktop/build-info.json', JSON.stringify({commit:process.env.COMPLAINTS_BUILD_COMMIT}))"
          npm run dist:win

      - name: Smoke test the built portable application
        shell: pwsh
        run: |
          $portable = (Get-ChildItem dist-desktop/*-portable.exe | Select-Object -First 1).FullName
          if (-not $portable) { throw "Portable executable is missing" }
          node scripts/smoke-packaged.js "$portable" | Tee-Object -FilePath dist-desktop/startup-portable.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test the installed application layout
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist-desktop/*-setup.exe | Select-Object -First 1).FullName
          if (-not $setup) { throw "Setup executable is missing" }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $executable = Join-Path dist-desktop/win-unpacked ($package.build.productName + '.exe')
          if (-not (Test-Path $executable)) { throw "Application executable is missing" }
          node scripts/smoke-packaged.js "$executable" | Tee-Object -FilePath dist-desktop/startup-installed-layout.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installing twice updates the same application
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist-desktop/*-setup.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'complaints-reinstall'
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $executable = Join-Path $installDir ($package.build.productName + '.exe')
          foreach ($pass in 1..2) {
            $process = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer pass $pass failed: $($process.ExitCode)" }
            if (-not (Test-Path $executable)) { throw 'Installed application is missing' }
            node scripts/smoke-packaged.js "$executable" | Tee-Object -FilePath "dist-desktop/startup-reinstall-$pass.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Record immutable artifact checksums
        run: node scripts/release-manifest.js

      - name: Attest Windows build provenance (public repositories)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist-desktop/*-setup.exe
            dist-desktop/*-portable.exe

      - name: Upload release verification files (internal)
        uses: actions/upload-artifact@v4
        with:
          name: complaints-system-release-verification
          path: |
            dist-desktop/*-setup.exe
            dist-desktop/*-portable.exe
            dist-desktop/SHA256SUMS.txt
            dist-desktop/build-manifest.json
            dist-desktop/startup-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload single installer download
        uses: actions/upload-artifact@v4
        with:
          name: complaints-system-windows-installer
          path: dist-desktop/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    concurrency:
      group: complaints-release-publication
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: complaints-system-release-verification
          path: dist-desktop
      - name: Publish verified Windows release
        run: node scripts/publish-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only the verified current release
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          if (repo !== 'mgedh9ali-cpu/Complaints-System' || process.env.GITHUB_REF !== 'refs/heads/main' || !/^[a-f0-9]{40}$/.test(sha || '')) {
            throw new Error('Unexpected cleanup repository, branch, or commit.');
          }
          const api = 'https://api.github.com/repos/' + repo;
          const headers = {
            Authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          async function request(path, method = 'GET') {
            const response = await fetch(api + path, {method, headers});
            if (!response.ok) throw new Error(method + ' ' + path + ' failed: ' + response.status);
            return response.status === 204 ? null : response.json();
          }
          const head = await request('/git/ref/heads/main');
          if (head.object?.sha !== sha) throw new Error('A newer main commit exists; leave previous releases available until its build succeeds.');
          const tag = 'v' + version + '-build.' + sha;
          const current = await request('/releases/tags/' + encodeURIComponent(tag));
          const manifest = JSON.parse(fs.readFileSync('dist-desktop/build-manifest.json', 'utf8'));
          const installer = manifest.artifacts.find(a => a.filename === 'complaints-system-' + version + '-setup.exe');
          const asset = current.assets.find(a => a.name === installer?.filename);
          const ref = await request('/git/ref/tags/' + encodeURIComponent(tag));
          if (current.draft || current.assets.length !== 1 || current.target_commitish !== sha || ref.object?.sha !== sha ||
              manifest.commit !== sha || manifest.version !== version || !installer ||
              !asset || asset.state !== 'uploaded' || asset.size !== installer.bytes ||
              asset.digest !== 'sha256:' + installer.sha256) {
            throw new Error('The new published installer must be verified before cleanup.');
          }
          // Collect all pages before deleting so pagination cannot skip older releases.
          const previous = [];
          let complete = false;
          for (let page = 1; page <= 100; page++) {
            const batch = await request('/releases?per_page=100&page=' + page);
            previous.push(...batch.filter(r => r.id !== current.id));
            if (batch.length < 100) { complete = true; break; }
          }
          if (!complete) throw new Error('Release enumeration exceeded the safe pagination limit.');
          for (const release of previous) {
            await request('/releases/' + release.id, 'DELETE');
            console.log('Deleted previous release: ' + release.tag_name);
          }
          const remaining = await request('/releases?per_page=100');
          if (remaining.length !== 1 || remaining[0].id !== current.id) {
            throw new Error('Release cleanup verification failed.');
          }
          console.log('Verified: only ' + tag + ' remains. Git tags and source history are retained.');
          NODE


