name: Build Windows Portable

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify installed dependency tree
        run: npm ls --all

      - name: Build SQLite for Node.js tests
        run: npm rebuild better-sqlite3

      - name: Syntax checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Install Electron runtime
        run: npm rebuild electron

      - name: Rebuild native SQLite for Electron
        run: npx electron-builder install-app-deps

      - name: Build portable EXE
        run: npm run dist:win

      - name: Smoke test the built portable application
        shell: pwsh
        run: |
          $portable = (Get-ChildItem dist-desktop/*-portable.exe | Select-Object -First 1).FullName
          if (-not $portable) { throw "Portable executable is missing" }
          node scripts/smoke-packaged.js "$portable"

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: complaints-system-windows-portable
          path: dist-desktop/*-portable.exe
          if-no-files-found: error
          retention-days: 14
