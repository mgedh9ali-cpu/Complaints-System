name: Build Windows Portable

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify installed dependency tree
        run: npm ls --all || true

      - name: Verify SQLite native runtime for Node.js tests
        run: npm run check:sqlite

      - name: Syntax checks
        run: npm run check

      - name: Run tests
        timeout-minutes: 5
        run: npm test -- --test-timeout=120000

      - name: Security audit
        run: npm audit --audit-level=high || true --audit-level=low

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Rebuild native SQLite for Electron
        run: npx electron-builder install-app-deps

      - name: Build portable EXE
        run: npm run dist:win

      - name: Smoke test the built portable application
        shell: pwsh
        run: |
          $portable = (Get-ChildItem dist-desktop/*-portable.exe | Select-Object -First 1).FullName
          if (-not $portable) { throw "Portable executable is missing" }
          node scripts/smoke-packaged.js "$portable"

      - name: Record immutable artifact checksums
        run: node scripts/release-manifest.js

      - name: Attest Windows build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: dist-desktop/*-portable.exe

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: complaints-system-windows-portable
          path: |
            dist-desktop/*-portable.exe
            dist-desktop/SHA256SUMS.txt
            dist-desktop/build-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: complaints-system-windows-portable
          path: dist-desktop
      - name: Publish verified Windows release
        run: node scripts/publish-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
