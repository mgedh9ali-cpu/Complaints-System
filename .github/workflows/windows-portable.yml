name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build portable EXE
        run: npm run dist:win

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: complaints-system-windows-portable
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 14
