<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="../thmanyah-fonts.css">
<title>الاستفسارات والشكاوى</title>
<style>
  html,body{margin:0;height:100%;background:#0F2A1D}
  body{display:grid;place-items:center;color:#E3EED4;font:600 18px var(--font);
    background:radial-gradient(700px 420px at 100% 0,#375534,transparent 60%),radial-gradient(600px 380px at 0 100%,#6B9071,transparent 62%),#0F2A1D}
  .box{display:grid;justify-items:center;gap:20px;animation:in .5s cubic-bezier(.16,1,.3,1) both}
  .ring{width:46px;height:46px;border-radius:50%;border:4px solid rgb(236 253 245/.22);border-top-color:#AEC3B0;animation:spin .8s linear infinite}
  small{color:#AEC3B0;font-weight:400;font-size:14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.ring,.box{animation:none}}
</style>
</head>
<body>
  <div class="box" role="status" aria-live="polite">
    <div class="ring" aria-hidden="true"></div>
    <div>جارٍ تشغيل النظام…</div>
    <small>الاستفسارات والشكاوى</small>
  </div>
</body>
</html>
