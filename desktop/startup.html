<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام الاستفسارات والشكاوى</title>
<style>
html{background:#F1F6F3;color:#142E25;font:16px/1.8 Tahoma,Arial,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center}
main{max-width:32rem;padding:40px;text-align:center}
.mark{margin:0 auto 24px;width:64px;height:64px;display:grid;place-items:center;background:#086747;color:white;border-radius:16px;font-size:30px}
h1{font-size:24px;margin:0 0 12px}p{color:#465F54;margin:0}
.activity{width:48px;height:4px;border-radius:4px;margin:28px auto;background:#086747;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scaleX(.5);opacity:.5}}
@media(prefers-reduced-motion:reduce){.activity{animation:none}}
</style>
<main role="status" aria-live="polite"><div class="mark" aria-hidden="true">✓</div><h1>شعبة الاستفسارات والشكاوى</h1><p>جارٍ فتح مساحة العمل…</p><div class="activity" aria-hidden="true"></div><p>يُجهّز النظام بياناتك المحلية ويتحقق من سلامتها.</p></main>
</html>
