<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'">
<title>تحديث نظام الشكاوى</title>
<link rel="stylesheet" href="../thmanyah-fonts.css">
<link rel="stylesheet" href="update.css">
</head>
<body>
<main>
  <header>
    <h1>تحديث التطبيق</h1>
    <span id="version" class="version" dir="ltr" hidden></span>
  </header>
  <p id="message" role="status">جارٍ التحقق من آخر إصدار…</p>
  <div id="progress-group" class="progress-group">
    <label id="progress-label" for="progress">جارٍ التحقق</label>
    <output id="percent" aria-hidden="true"></output>
    <progress id="progress" max="100" aria-labelledby="progress-label"></progress>
  </div>
  <form id="credentials" hidden>
    <label for="token">رمز وصول GitHub</label>
    <p id="token-help">استخدم رمز Fine-grained بصلاحية Contents: Read-only لمستودع Complaints-System. يُحفظ مشفّرًا على هذا الجهاز.</p>
    <input id="token" type="password" dir="ltr" autocomplete="off" required maxlength="300" aria-describedby="token-help token-error">
    <p id="token-error" role="alert"></p>
    <button type="submit">حفظ ومتابعة</button>
  </form>
  <section id="release-notes" aria-labelledby="notes-title" hidden>
    <h2 id="notes-title">ملاحظات الإصدار</h2>
    <p id="notes" dir="auto"></p>
  </section>
  <footer>
    <button id="install" hidden>تنزيل وتثبيت</button>
    <button id="close" class="secondary" hidden>إغلاق</button>
  </footer>
</main>
<script src="update-view.js"></script>
</body>
</html>
